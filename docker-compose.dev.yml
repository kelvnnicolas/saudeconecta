services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saudeconecta
    ports:
      - "5432:5432"
    volumes:
      - saudeconecta_db_data:/var/lib/postgresql/data

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saudeconecta_test
    ports:
      - "5433:5432"

volumes:
  saudeconecta_db_data:
