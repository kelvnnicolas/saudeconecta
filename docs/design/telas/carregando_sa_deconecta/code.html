</div>
<div class="h-6 w-20 rounded-full bg-surface-container-high animate-pulse"></div>

<script>
  (function () {
    // Add custom dynamic keyframe styles programmatically without raw style tag leaks
    const styleEl = document.createElement('style');
    styleEl.innerHTML = `
      @keyframes ecgPulse {
        0%, 100% {
          transform: scale(1);
        }
        25% {
          transform: scale(1.16);
        }
        40% {
          transform: scale(0.96);
        }
        60% {
          transform: scale(1.10);
        }
      }

      @keyframes ecgFlow {
        0% {
          stroke-dashoffset: 400;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      .vital-trace {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: ecgFlow 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    `;
    document.head.appendChild(styleEl);
  })();
</script></main></body></html>
